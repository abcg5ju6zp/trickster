listeners:
    kgw--listener-http-80:
        port: 80
    kgw--listener-http-8080:
        port: 8080
    kgw--listener-https-443:
        tls_port: 443
        tls_runtime_certs: true
backends:
    kgw--httproute.shop.api_r0:
        provider: rp
        origin_url: http://web-svc.shop.svc:8080
        hosts:
            - extra.example.com
        listener_names:
            - kgw--listener-https-443
        cache_key_prefix: httproute.shop.api
        path_routing_disabled: true
        path_defaults_disabled: true
        preserve_host: true
        paths:
            - path: /api
              match_type: segment
              handler: proxy
              methods:
                - '*'
    kgw--httproute.shop.web_r0:
