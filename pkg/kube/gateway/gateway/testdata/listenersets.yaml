apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: trickster
spec:
  controllerName: trickstercache.org/gateway-controller
---
# the Gateway opens an HTTP listener and an HTTPS one itself, and lets ListenerSets in its own
# namespace attach more listeners through allowedListeners
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: infra
spec:
  gatewayClassName: trickster
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: inline.example.com
      tls:
        certificateRefs:
          - name: web-tls
      allowedRoutes:
        namespaces:
          from: All
---
# the attached set merges its entries with the inline ones: a new hostname on the shared HTTPS
# port carries its own certificate, and a plaintext listener takes a new port
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: extra
  namespace: infra
spec:
  parentRef:
    name: gw
    kind: Gateway
  listeners:
    - name: extra-http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: extra-https
      port: 443
      protocol: HTTPS
      hostname: extra.example.com
      tls:
        certificateRefs:
          - name: extra-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: Secret
metadata:
  name: web-tls
  namespace: infra
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: Secret
metadata:
  name: extra-tls
  namespace: infra
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# one parentRef to the Gateway reaches only its inline listeners; one to the ListenerSet reaches
# only the set's entries: the direct parent decides which listeners a route attaches to
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: shop
spec:
  parentRefs:
    - name: gw
      namespace: infra
    - name: extra
      namespace: infra
      kind: ListenerSet
  hostnames:
    - shop.example.com
    - extra.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /shop
      backendRefs:
        - name: web-svc
          port: 8080
---
# a sectionName pins the route to the one HTTPS entry; it never reaches the Gateway's listeners
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: shop
spec:
  parentRefs:
    - name: extra
      namespace: infra
      kind: ListenerSet
      sectionName: extra-https
  hostnames:
    - extra.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: web-svc
          port: 8080
